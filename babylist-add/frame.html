<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add to Babylist</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: system-ui, sans-serif; }
  #bl-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  #bl-fallback-bar {
    position: fixed; top: 10px; right: 10px; z-index: 2; display: flex; gap: 6px;
  }
  #bl-fallback-bar a, #bl-fallback-bar button {
    font: 600 12px system-ui, sans-serif; padding: 6px 10px; border-radius: 999px; border: 0;
    background: rgba(17, 24, 39, 0.85); color: #fff; text-decoration: none; cursor: pointer;
  }
</style>
</head>
<body>
  <!-- Fallback controls in case Babylist's own modal can't load (e.g. third-party cookies blocked). -->
  <div id="bl-fallback-bar">
    <a id="bl-open-tab" href="#" target="_blank" rel="noopener">Open in tab ↗</a>
    <button type="button" id="bl-close" aria-label="Close">✕</button>
  </div>
  <iframe id="bl-frame" allowtransparency="true" title="Add to Babylist"></iframe>
  <script src="frame.js"></script>
</body>
</html>
