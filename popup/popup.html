<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Babylist Universal Search</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-top">
    <div class="avatar">✨</div>
    <div>
      <h3>Babylist Universal</h3>
      <span class="sub">Multi-Catalog Search &amp; Addie AI</span>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="popup-search-input" placeholder="Search Babylist, Amazon, Target &amp; Guides..." />
    <button type="button" id="popup-search-btn">Search</button>
  </div>

  <div class="quick-stats">
    <div class="stat-pill">
      <span class="label">Universal Sources:</span>
      <span class="val">Shop • Amazon • Target • Guides</span>
    </div>
  </div>

  <div class="action-buttons">
    <button type="button" id="open-panel-btn" class="btn-primary">
      Open Universal Search &amp; Addie AI ↗
    </button>
  </div>

  <div class="footer">
    Unofficial prototype • not affiliated with Babylist
  </div>

  <script src="popup.js"></script>
</body>
</html>
